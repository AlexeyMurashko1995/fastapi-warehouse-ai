name: Python CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: download-code
        uses: actions/checkout@v4
      - name: download-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: download-libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
